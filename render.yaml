services:
  # 1. Express Backend Gateway
  - type: web
    name: intellicare-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: intellicare-ai-service
          property: host

  # 2. FastAPI AI Engine Microservice
  - type: web
    name: intellicare-ai-service
    env: python
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
