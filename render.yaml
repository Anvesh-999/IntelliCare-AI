services:
  # 1. Express Backend Gateway
  - type: web
    name: intellicare-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: intellicare-ai-service
          property: host

  # 2. FastAPI AI Engine Microservice
  - type: web
    name: intellicare-ai-service
    env: python
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: INTERNAL_SERVICE_TOKEN
        value: intellicare_internal_ai_secret_token_2026
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5000,https://intelli-care-ai-dalt.vercel.app
